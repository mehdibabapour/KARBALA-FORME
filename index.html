<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فرم ثبت‌نام سفر کربلا</title>
  <style>
    /* ── توکن‌های رنگی ───────────────────────────────────────────── */
    :root {
      --clr-bg:        oklch(97% .008 240);
      --clr-surface:   oklch(100% 0 0);
      --clr-border:    oklch(88% .010 240);
      --clr-muted:     oklch(55% .015 240);
      --clr-body:      oklch(18% .020 240);
      --clr-accent:    oklch(50% .18  250);
      --clr-accent-h:  oklch(44% .18  250);
      --clr-success:   oklch(45% .15  155);
      --clr-error:     oklch(45% .18   25);
      --clr-warn:      oklch(52% .17   75);
      --radius-sm:     6px;
      --radius-md:     12px;
      --radius-lg:     18px;
      --space-xs:      4px;
      --space-sm:      8px;
      --space-md:      16px;
      --space-lg:      24px;
      --space-xl:      40px;
      --font-body:     'Vazirmatn', 'Tahoma', system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --clr-bg:       oklch(14% .012 240);
        --clr-surface:  oklch(20% .014 240);
        --clr-border:   oklch(32% .016 240);
        --clr-muted:    oklch(60% .015 240);
        --clr-body:     oklch(93% .010 240);
        --clr-accent:   oklch(62% .16  250);
        --clr-accent-h: oklch(68% .16  250);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }

    /* ── پایه ────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--clr-bg);
      color: var(--clr-body);
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: var(--space-lg) var(--space-md);
      line-height: 1.6;
    }
    a { color: var(--clr-accent); }

    /* ── کارت اصلی ───────────────────────────────────────────────── */
    .card {
      background: var(--clr-surface);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-lg);
      padding: var(--space-xl) var(--space-lg);
      width: 100%;
      max-width: 480px;
      box-shadow: 0 2px 12px oklch(0% 0 0 / .06);
    }
    .card-header {
      text-align: center;
      margin-bottom: var(--space-lg);
    }
    .card-header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--clr-accent);
      margin-bottom: var(--space-xs);
    }
    .card-header p {
      font-size: .88rem;
      color: var(--clr-muted);
    }

    /* ── تایمر ───────────────────────────────────────────────────── */
    #countdown-box {
      background: oklch(97% .014 250);
      border: 1px solid oklch(84% .030 250);
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      text-align: center;
      margin-bottom: var(--space-lg);
      font-size: .88rem;
      color: var(--clr-muted);
      display: none;
    }
    @media (prefers-color-scheme: dark) {
      #countdown-box { background: oklch(22% .016 250); border-color: oklch(34% .028 250); }
    }
    #countdown-box.visible { display: block; }
    #countdown-box.expired { border-color: var(--clr-error); color: var(--clr-error); }
    #countdown-time {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--clr-accent);
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em;
    }
    #countdown-box.expired #countdown-time { color: var(--clr-error); }

    /* ── تب‌ها ────────────────────────────────────────────────────── */
    .tabs {
      display: flex;
      border-bottom: 2px solid var(--clr-border);
      margin-bottom: var(--space-lg);
    }
    .tab-btn {
      flex: 1;
      padding: var(--space-sm) 0;
      font-family: inherit;
      font-size: .9rem;
      font-weight: 600;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      cursor: pointer;
      color: var(--clr-muted);
      transition: color .15s, border-color .15s;
    }
    .tab-btn:hover { color: var(--clr-body); }
    .tab-btn.active { color: var(--clr-accent); border-bottom-color: var(--clr-accent); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── فرم ─────────────────────────────────────────────────────── */
    .field { margin-bottom: var(--space-md); }
    label {
      display: block;
      font-size: .88rem;
      font-weight: 600;
      margin-bottom: var(--space-xs);
    }
    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 10px var(--space-md);
      border: 1.5px solid var(--clr-border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: .95rem;
      background: var(--clr-bg);
      color: var(--clr-body);
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus {
      outline: none;
      border-color: var(--clr-accent);
      box-shadow: 0 0 0 3px oklch(50% .18 250 / .15);
    }
    input.error-field { border-color: var(--clr-error); }
    input.error-field:focus { box-shadow: 0 0 0 3px oklch(45% .18 25 / .15); }
    .field-error {
      font-size: .80rem;
      color: var(--clr-error);
      margin-top: var(--space-xs);
      display: none;
    }
    .field-error.visible { display: block; }

    /* چک‌باکس زائر اولی */
    .check-row {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      margin-bottom: var(--space-md);
      font-size: .9rem;
    }
    .check-row input[type="checkbox"] {
      width: 18px; height: 18px;
      accent-color: var(--clr-accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ── دکمه ────────────────────────────────────────────────────── */
    .btn {
      width: 100%;
      padding: 12px;
      background: var(--clr-accent);
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background .15s, transform .1s;
      min-height: 44px;
    }
    .btn:hover  { background: var(--clr-accent-h); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .btn:focus-visible { outline: 3px solid var(--clr-accent); outline-offset: 2px; }

    /* ── پیام نتیجه ──────────────────────────────────────────────── */
    .result-box {
      margin-top: var(--space-md);
      padding: var(--space-md);
      border-radius: var(--radius-md);
      font-size: .92rem;
      display: none;
      line-height: 1.7;
    }
    .result-box.visible { display: block; }
    .result-box.success  { background: oklch(95% .04 155); border: 1px solid oklch(80% .08 155); color: oklch(28% .12 155); }
    .result-box.error    { background: oklch(96% .04  25); border: 1px solid oklch(82% .10  25); color: oklch(32% .15  25); }
    .result-box.warning  { background: oklch(96% .04  75); border: 1px solid oklch(82% .10  75); color: oklch(32% .14  75); }
    @media (prefers-color-scheme: dark) {
      .result-box.success { background: oklch(22% .07 155); border-color: oklch(36% .10 155); color: oklch(78% .10 155); }
      .result-box.error   { background: oklch(22% .07  25); border-color: oklch(36% .12  25); color: oklch(78% .12  25); }
      .result-box.warning { background: oklch(22% .07  75); border-color: oklch(36% .12  75); color: oklch(78% .10  75); }
    }
    .tracking-code {
      display: inline-block;
      font-family: monospace;
      font-size: 1rem;
      font-weight: 700;
      background: oklch(90% .05 250);
      color: var(--clr-accent);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      letter-spacing: .05em;
    }
    @media (prefers-color-scheme: dark) {
      .tracking-code { background: oklch(28% .07 250); }
    }

    /* ── اسپینر ──────────────────────────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #fff4;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-left: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── واکنش‌گرا ───────────────────────────────────────────────── */
    @media (max-width: 520px) {
      .card { padding: var(--space-lg) var(--space-md); }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <h1>🕌 ثبت‌نام سفر کربلا</h1>
    <p>فرم ثبت‌نام قرعه‌کشی سفر رایگان</p>
  </div>

  <!-- تایمر شمارش معکوس -->
  <div id="countdown-box">
    <div>زمان باقی‌مانده تا پایان ثبت‌نام</div>
    <div id="countdown-time">--:--:--</div>
  </div>

  <!-- تب‌ها -->
  <div class="tabs" role="tablist">
    <button class="tab-btn active" role="tab" aria-selected="true"  data-tab="register" onclick="switchTab('register')">ثبت‌نام</button>
    <button class="tab-btn"        role="tab" aria-selected="false" data-tab="lookup"   onclick="switchTab('lookup')">استعلام کد</button>
  </div>

  <!-- ─── پنل ثبت‌نام ─── -->
  <div id="tab-register" class="tab-panel active" role="tabpanel">
    <form id="form-register" onsubmit="submitRegister(event)" novalidate>

      <div class="field">
        <label for="reg-name">نام و نام خانوادگی</label>
        <input type="text" id="reg-name" placeholder="مثال: علی محمدی" autocomplete="name" />
        <span class="field-error" id="err-reg-name">لطفاً نام خود را وارد کنید.</span>
      </div>

      <div class="field">
        <label for="reg-national">کد ملی</label>
        <input type="tel" id="reg-national" placeholder="۱۰ رقم" maxlength="10" inputmode="numeric" />
        <span class="field-error" id="err-reg-national">کد ملی باید ۱۰ رقم باشد.</span>
      </div>

      <div class="field">
        <label for="reg-mobile">شماره موبایل</label>
        <input type="tel" id="reg-mobile" placeholder="مثال: ۰۹۱۲۳۴۵۶۷۸۹" maxlength="11" inputmode="numeric" />
        <span class="field-error" id="err-reg-mobile">شماره موبایل معتبر نیست.</span>
      </div>

      <div class="check-row">
        <input type="checkbox" id="reg-first-pilgrim" />
        <label for="reg-first-pilgrim" style="margin:0;font-weight:400">زائر اولی هستم</label>
      </div>

      <button type="submit" class="btn" id="btn-register">ثبت‌نام</button>
    </form>
    <div class="result-box" id="result-register"></div>
  </div>

  <!-- ─── پنل استعلام ─── -->
  <div id="tab-lookup" class="tab-panel" role="tabpanel">
    <form id="form-lookup" onsubmit="submitLookup(event)" novalidate>

      <div class="field">
        <label for="lkp-national">کد ملی</label>
        <input type="tel" id="lkp-national" placeholder="۱۰ رقم" maxlength="10" inputmode="numeric" />
        <span class="field-error" id="err-lkp-national">کد ملی باید ۱۰ رقم باشد.</span>
      </div>

      <div class="field">
        <label for="lkp-mobile">شماره موبایل</label>
        <input type="tel" id="lkp-mobile" placeholder="مثال: ۰۹۱۲۳۴۵۶۷۸۹" maxlength="11" inputmode="numeric" />
        <span class="field-error" id="err-lkp-mobile">شماره موبایل معتبر نیست.</span>
      </div>

      <button type="submit" class="btn" id="btn-lookup">استعلام</button>
    </form>
    <div class="result-box" id="result-lookup"></div>
  </div>
</div>

<script>
  /* ── تنظیمات ──────────────────────────────────────────────────────────── */
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbwSkH5ncDk5P-vpebrMb2A8EBik1Jrzecw_kvG2RzEOMMV8MjmSuuG9JOtOICRbUq4/exec';

  /* ── تایمر ────────────────────────────────────────────────────────────── */
  let countdownInterval = null;

  function startCountdown(isoDeadline) {
    const box      = document.getElementById('countdown-box');
    const timeEl   = document.getElementById('countdown-time');
    const deadline = new Date(isoDeadline);
    if (isNaN(deadline)) return;

    box.classList.add('visible');

    function tick() {
      const diff = deadline - Date.now();
      if (diff <= 0) {
        clearInterval(countdownInterval);
        timeEl.textContent = 'پایان یافت';
        box.classList.add('expired');
        return;
      }
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      timeEl.textContent =
        String(h).padStart(2,'0') + ':' +
        String(m).padStart(2,'0') + ':' +
        String(s).padStart(2,'0');
    }
    tick();
    countdownInterval = setInterval(tick, 1000);
  }

  async function fetchDeadline() {
    try {
      const r = await fetch(GAS_URL + '?action=getDeadline');
      const d = await r.json();
      if (d.status === 'ok' && d.deadline) startCountdown(d.deadline);
    } catch (_) {}
  }

  fetchDeadline();

  /* ── تب‌ها ─────────────────────────────────────────────────────────────── */
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => {
      const active = b.dataset.tab === tab;
      b.classList.toggle('active', active);
      b.setAttribute('aria-selected', active);
    });
    document.querySelectorAll('.tab-panel').forEach(p => {
      p.classList.toggle('active', p.id === 'tab-' + tab);
    });
  }

  /* ── اعتبارسنجی ────────────────────────────────────────────────────────── */
  function toEnDigit(str) {
    return str.replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776)
              .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632);
  }
  function validateNational(v) { return /^\d{10}$/.test(toEnDigit(v)); }
  function validateMobile(v)   { return /^09\d{9}$/.test(toEnDigit(v)); }

  function showFieldError(inputId, errId, show) {
    const inp = document.getElementById(inputId);
    const err = document.getElementById(errId);
    inp.classList.toggle('error-field', show);
    err.classList.toggle('visible', show);
    return !show;
  }

  /* ── نمایش نتیجه ───────────────────────────────────────────────────────── */
  function showResult(boxId, type, html) {
    const box = document.getElementById(boxId);
    box.className = 'result-box visible ' + type;
    box.innerHTML = html;
  }

  /* ── ثبت‌نام ───────────────────────────────────────────────────────────── */
  async function submitRegister(e) {
    e.preventDefault();

    const name     = document.getElementById('reg-name').value.trim();
    const national = toEnDigit(document.getElementById('reg-national').value.trim());
    const mobile   = toEnDigit(document.getElementById('reg-mobile').value.trim());
    const firstP   = document.getElementById('reg-first-pilgrim').checked ? 'yes' : 'no';

    let valid = true;
    valid = showFieldError('reg-name',     'err-reg-name',     !name)           && valid;
    valid = showFieldError('reg-national', 'err-reg-national', !validateNational(national)) && valid;
    valid = showFieldError('reg-mobile',   'err-reg-mobile',   !validateMobile(mobile))   && valid;
    if (!valid) return;

    const btn = document.getElementById('btn-register');
    btn.disabled = true;
    btn.innerHTML = 'در حال ارسال <span class="spinner"></span>';

    try {
      const url = `${GAS_URL}?action=register&fullName=${encodeURIComponent(name)}&nationalId=${encodeURIComponent(national)}&mobile=${encodeURIComponent(mobile)}&isFirstPilgrim=${firstP}`;
      const res = await fetch(url);
      const data = await res.json();

      if (data.status === 'success') {
        showResult('result-register', 'success',
          `✅ ثبت‌نام شما با موفقیت انجام شد.<br>
           کد پیگیری: <span class="tracking-code">${data.trackingCode}</span><br>
           <small style="color:var(--clr-muted)">این کد را ذخیره کنید.</small>`);
        document.getElementById('form-register').reset();

      } else if (data.status === 'duplicate') {
        showResult('result-register', 'warning',
          '⚠️ شما قبلاً با این اطلاعات ثبت‌نام کرده‌اید.');

      } else if (data.status === 'duplicate_national') {
        showResult('result-register', 'error',
          '❌ این کد ملی قبلاً در سیستم ثبت شده است.');

      } else if (data.status === 'duplicate_mobile') {
        showResult('result-register', 'error',
          '❌ این شماره موبایل قبلاً در سیستم ثبت شده است.');

      } else if (data.status === 'closed') {
        showResult('result-register', 'error',
          '🔒 مهلت ثبت‌نام به پایان رسیده است.');

      } else {
        showResult('result-register', 'error',
          '❌ خطایی رخ داد. لطفاً مجدداً تلاش کنید.');
      }
    } catch (_) {
      showResult('result-register', 'error',
        '❌ خطا در اتصال به سرور. اینترنت خود را بررسی کنید.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'ثبت‌نام';
    }
  }

  /* ── استعلام ───────────────────────────────────────────────────────────── */
  async function submitLookup(e) {
    e.preventDefault();

    const national = toEnDigit(document.getElementById('lkp-national').value.trim());
    const mobile   = toEnDigit(document.getElementById('lkp-mobile').value.trim());

    let valid = true;
    valid = showFieldError('lkp-national', 'err-lkp-national', !validateNational(national)) && valid;
    valid = showFieldError('lkp-mobile',   'err-lkp-mobile',   !validateMobile(mobile))   && valid;
    if (!valid) return;

    const btn = document.getElementById('btn-lookup');
    btn.disabled = true;
    btn.innerHTML = 'در حال جستجو <span class="spinner"></span>';

    try {
      const url = `${GAS_URL}?action=lookup&nationalId=${encodeURIComponent(national)}&mobile=${encodeURIComponent(mobile)}`;
      const res  = await fetch(url);
      const data = await res.json();

      if (data.status === 'found') {
        showResult('result-lookup', 'success',
          `✅ اطلاعات ثبت‌نام شما:<br>
           نام: <strong>${data.fullName}</strong><br>
           کد پیگیری: <span class="tracking-code">${data.trackingCode}</span>`);

      } else if (data.status === 'not_found' && data.message === 'یکی از اطلاعات وارد شده صحیح نمی‌باشد') {
        showResult('result-lookup', 'error',
          '❌ یکی از اطلاعات وارد شده صحیح نمی‌باشد.');

      } else {
        showResult('result-lookup', 'error',
          '❌ اطلاعاتی با این مشخصات یافت نشد.');
      }
    } catch (_) {
      showResult('result-lookup', 'error',
        '❌ خطا در اتصال به سرور.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'استعلام';
    }
  }
</script>
</body>
</html>
