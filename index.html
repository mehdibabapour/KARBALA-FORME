<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام و بازیابی رسید قرعه‌کشی سفر کربلا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; }
        #receipt-template { position: absolute; left: -9999px; top: -9999px; width: 400px; padding: 20px; background: white; border: 2px solid #800000; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center py-8 px-4">

    <!-- Loading Overlay -->
    <div id="loading" class="loading-overlay">
        <div class="text-white text-center">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-white mb-4 mx-auto"></div>
            <p id="loading-text">در حال پردازش...</p>
        </div>
    </div>

    <!-- Main Container -->
    <div class="max-w-md w-full bg-yellow-400 rounded-2xl shadow-2xl overflow-hidden">

        <!-- Poster Image -->
        <div class="w-full">
            <img src="poster.png" alt="Poster" class="w-full h-auto object-cover">
        </div>

        <!-- Content Area -->
        <div class="p-6">
            <h1 class="text-2xl font-bold text-center text-red-900 mb-6">ثبت‌نام و بازیابی رسید قرعه‌کشی سفر کربلا</h1>

            <!-- Form -->
            <form id="lotteryForm" class="space-y-4">

                <div>
                    <label class="block text-red-900 font-bold mb-1">نام</label>
                    <input type="text" id="firstName" required
                        class="w-full p-3 rounded-lg border-2 border-red-900 focus:outline-none focus:ring-2 focus:ring-red-600" dir="rtl">
                </div>

                <div>
                    <label class="block text-red-900 font-bold mb-1">نام خانوادگی</label>
                    <input type="text" id="lastName" required
                        class="w-full p-3 rounded-lg border-2 border-red-900 focus:outline-none focus:ring-2 focus:ring-red-600" dir="rtl">
                </div>

                <div>
                    <label class="block text-red-900 font-bold mb-1">کد ملی</label>
                    <input type="text" id="nationalId" required maxlength="10" pattern="\d{10}"
                        class="w-full p-3 rounded-lg border-2 border-red-900 focus:outline-none focus:ring-2 focus:ring-red-600 text-left" dir="ltr">
                </div>

                <div>
                    <label class="block text-red-900 font-bold mb-1">شماره موبایل</label>
                    <input type="tel" id="mobile" required maxlength="11" pattern="09\d{9}"
                        class="w-full p-3 rounded-lg border-2 border-red-900 focus:outline-none focus:ring-2 focus:ring-red-600 text-left" dir="ltr">
                </div>

                <!-- زائر اولی -->
                <div class="flex items-center gap-3 bg-red-50 border-2 border-red-900 rounded-lg p-3">
                    <input type="checkbox" id="isFirstPilgrim"
                        class="w-5 h-5 accent-red-900 cursor-pointer flex-shrink-0">
                    <label for="isFirstPilgrim" class="text-red-900 font-bold cursor-pointer select-none">
                        زائر اولی هستم (اولین سفرم به کربلاست)
                    </label>
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl text-xl transition duration-300 shadow-lg">
                    ثبت درخواست
                </button>
            </form>
        </div>
    </div>

    <!-- Footer Version -->
    <div class="mt-8 text-gray-500 text-sm">Version 18</div>

    <!-- Hidden Receipt Template for Download -->
    <div id="receipt-template">
        <div style="text-align: center; color: #800000; border-bottom: 2px solid #800000; padding-bottom: 10px; margin-bottom: 15px;">
            <h2 style="font-size: 22px; margin: 0;">رسید قرعه‌کشی سفر کربلا</h2>
        </div>
        <div style="font-size: 16px; line-height: 1.8; text-align: right; direction: rtl;">
            <p><strong>نام:</strong> <span id="rec-name"></span></p>
            <p><strong>کد ملی:</strong> <span id="rec-nat" style="direction: ltr; display: block; text-align: left;"></span></p>
            <p><strong>موبایل:</strong> <span id="rec-mob" style="direction: ltr; display: block; text-align: left;"></span></p>
            <hr style="margin: 15px 0; border: 0; border-top: 1px dashed #800000;">
            <p style="text-align: center; font-size: 18px;"><strong>کد رهگیری:</strong></p>
            <p id="rec-code" style="text-align: center; font-size: 24px; color: #800000; margin: 0;"></p>
        </div>
        <div style="text-align: center; margin-top: 20px; font-size: 12px; color: #666;">
            با آرزوی موفقیت در قرعه‌کشی
        </div>
    </div>

    <!-- Custom Popups -->
    <div id="customPopup" class="fixed inset-0 flex items-center justify-center z-[10000] hidden p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden transform transition-all">
            <div id="popupContent" class="p-6 text-center"></div>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="audioWelcome" src="welcome.mp3"></audio>
    <audio id="audioLoading" src="Loading.mp3"></audio>
    <audio id="audioSuccess" src="success.mp3"></audio>
    <audio id="audioDuplicate" src="duplicate.mp3"></audio>
    <audio id="audioDuplicateNational" src="duplicate_national.mp3"></audio>
    <audio id="duplicate-mobile" src="duplicate_mobile.mp3"></audio>

    <script>
        // --- CONFIGURATION ---
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwSkH5ncDk5P-vpebrMb2A8EBik1Jrzecw_kvG2RzEOMMV8MjmSuuG9JOtOICRbUq4/exec";

        const form = document.getElementById('lotteryForm');
        const loading = document.getElementById('loading');
        const loadingText = document.getElementById('loading-text');
        const popup = document.getElementById('customPopup');
        const popupContent = document.getElementById('popupContent');

        function playSound(id) {
            const sound = document.getElementById(id);
            if (sound) { sound.currentTime = 0; sound.play().catch(e => console.log("Audio play blocked")); }
        }

        function showPopup(title, message, type, buttonText, callback) {
            popupContent.innerHTML = `
                <h3 class="text-xl font-bold mb-2 ${type === 'success' ? 'text-green-600' : 'text-red-600'}">${title}</h3>
                <p class="text-gray-700 mb-6">${message}</p>
                <button id="popupBtn" class="w-full py-3 rounded-xl font-bold text-white transition ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}">
                    ${buttonText}
                </button>
            `;
            popup.querySelector('div').className = `bg-white rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden transform transition-all ${type === 'success' ? 'border-t-8 border-green-500' : 'border-t-8 border-red-500'}`;
            popup.classList.remove('hidden');
            document.getElementById('popupBtn').onclick = () => {
                popup.classList.add('hidden');
                if (callback) callback();
            };
        }

        async function downloadReceipt(name, nat, mob, code) {
            document.getElementById('rec-name').innerText = name;
            document.getElementById('rec-nat').innerText = nat;
            document.getElementById('rec-mob').innerText = mob;
            document.getElementById('rec-code').innerText = code;

            const template = document.getElementById('receipt-template');
            const canvas = await html2canvas(template, { scale: 2 });
            const image = canvas.toDataURL("image/png");
            const link = document.createElement('a');
            link.download = `receipt-${code}.png`;
            link.href = image;
            link.click();
        }

        form.onsubmit = async (e) => {
            e.preventDefault();

            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const fullName = `${firstName} ${lastName}`;
            const nationalId = document.getElementById('nationalId').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const isFirstPilgrim = document.getElementById('isFirstPilgrim').checked;

            loading.style.display = 'flex';
            loadingText.innerText = 'در حال برقراری ارتباط...';
            playSound('audioLoading');

            try {
                const url = `${WEB_APP_URL}?action=register`
                    + `&firstName=${encodeURIComponent(firstName)}`
                    + `&lastName=${encodeURIComponent(lastName)}`
                    + `&fullName=${encodeURIComponent(fullName)}`
                    + `&nationalId=${encodeURIComponent(nationalId)}`
                    + `&mobile=${encodeURIComponent(mobile)}`
                    + `&isFirstPilgrim=${encodeURIComponent(isFirstPilgrim)}`;

                const response = await fetch(url, {
                    method: 'GET',
                    redirect: 'follow'
                });

                const text = await response.text();
                let result;
                try {
                    result = JSON.parse(text);
                } catch (parseErr) {
                    console.error('Server raw response:', text);
                    throw new Error('پاسخ سرور قابل تجزیه نیست: ' + text.substring(0, 100));
                }

                loading.style.display = 'none';

                if (result.status === 'success') {
                    playSound('audioSuccess');
                    showPopup(
                        '🎉 موفقیت‌آمیز!',
                        'ثبت‌نام شما با موفقیت انجام شد. لطفاً رسید خود را دریافت کنید.',
                        'success',
                        '📥 دانلود رسید قرعه‌کشی سفر کربلا',
                        () => downloadReceipt(fullName, nationalId, mobile, result.trackingCode)
                    );

                } else if (result.status === 'duplicate') {
                    playSound('audioDuplicate');
                    showPopup(
                        '⚠️ قبلاً ثبت‌نام کرده‌اید',
                        'شما قبلاً در این قرعه‌کشی ثبت‌نام کرده‌اید. برای دریافت مجدد رسید، روی دکمه زیر کلیک کنید.',
                        'error',
                        '📥 دریافت مجدد رسید',
                        () => downloadReceipt(fullName, nationalId, mobile, result.trackingCode)
                    );

                } else if (result.status === 'duplicate_national') {
                    playSound('audioDuplicateNational');
                    showPopup(
                        '⚠️ کد ملی تکراری',
                        'این کد ملی قبلاً در سیستم ثبت شده است.',
                        'error',
                        'متوجه شدم',
                        null
                    );

                } else if (result.status === 'duplicate_mobile') {
                    playSound('duplicate-mobile');
                    showPopup(
                        '⚠️ شماره موبایل تکراری',
                        'این شماره موبایل قبلاً در سیستم ثبت شده است.',
                        'error',
                        'متوجه شدم',
                        null
                    );

                } else if (result.status === 'closed') {
                    showPopup(
                        '🔒 ثبت‌نام بسته است',
                        result.message || 'متأسفانه ثبت‌نام در حال حاضر بسته می‌باشد.',
                        'error',
                        'متوجه شدم',
                        null
                    );

                } else {
                    throw new Error(result.message || 'خطای ناشناخته از سرور');
                }

            } catch (error) {
                loading.style.display = 'none';
                console.error('Error details:', error);
                showPopup(
                    '❌ خطا',
                    'خطایی در ارتباط با سرور رخ داد. لطفاً دوباره تلاش کنید.<br><small style="color:#999">' + error.message + '</small>',
                    'error',
                    'تلاش مجدد',
                    null
                );
            }
        };

        window.addEventListener('click', () => {
            if (!window.welcomePlayed) {
                playSound('audioWelcome');
                window.welcomePlayed = true;
            }
        }, { once: true });
    </script>
</body>
</html>
